plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation']
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel'
    exclude '**/.cache/**'
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }

        filter {
            includeGroup 'maven.modrinth'
        }
    }

    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }

    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'

        content {
            includeGroup 'software.bernie.geckolib'
        }
    }

    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
    }

    flatDir {
        dirs 'libs'
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            data()
            programArguments.addAll(
                    '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
            )
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // =========================================================
    // EXISTING COBBLEMON NML DEPENDENCIES
    // =========================================================
    implementation 'maven.modrinth:MdwFAVRL:S1TrAn8c'
    implementation 'thedarkcolour:kotlinforforge-neoforge:5.12.0'
    implementation 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.2'
    implementation 'maven.modrinth:GebWh45l:KfuSZLkT'
    implementation 'maven.modrinth:lhGA9TYQ:1IiqEQGl'
    implementation 'maven.modrinth:CBfM2yw7:zpphgptV'
    implementation 'maven.modrinth:NApIzVVy:IIauGpPZ'
    implementation "curse.maven:cobblemon-fight-or-flight-reborn-1168140:8404745"

    // No Man's Land 1.5.12 (Minecraft 1.21.1 NeoForge)
    implementation 'maven.modrinth:kjZCvAn6:bcszfrVc'

    implementation files('libs/easy_npc-neoforge-1.21.1-7.8.0.jar')
    implementation files('libs/easy_npc_bundle-neoforge-1.21.1-7.8.0.jar')
    implementation files('libs/easy_npc_config_ui-neoforge-1.21.1-7.8.0.jar')
    implementation files('libs/CobblemonTrialsEdition-neoforge-2.1.0.jar')
    implementation files('libs/yagm-1.21.1-0.1.2-NEOFORGE.jar')

    // YAGM -> OctoLib
    implementation files('libs/OctoLib-NEOFORGE-0.6.2+1.21.jar')
}

def fireStateTest = tasks.register('fireStateTest', JavaExec) {
    group = 'verification'
    description = 'Runs the Fire type-effect state and rules regression tests.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.epiac9.cobblemonnml.battle.action.typeeffect.fire.ActionBattleFireStateTest'
}

def typeEffectControllerTest = tasks.register('typeEffectControllerTest', JavaExec) {
    group = 'verification'
    description = 'Runs the type-effect session ownership regression tests.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.epiac9.cobblemonnml.battle.action.typeeffect.ActionBattleTypeEffectControllerTest'
}

def iceTypeEffectTest = tasks.register('iceTypeEffectTest', JavaExec) {
    group = 'verification'
    description = 'Runs the Ice type-effect state, timing, and reapplication tests.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.epiac9.cobblemonnml.battle.action.typeeffect.ice.ActionBattleIceStateTest'
}

def iceTypeEffectDeliveryTest = tasks.register('iceTypeEffectDeliveryTest', JavaExec) {
    group = 'verification'
    description = 'Runs the Ice shield penetration and delivery regression tests.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.epiac9.cobblemonnml.battle.action.typeeffect.ice.ActionBattleIceDeliveryTest'
}

def iceTypeEffectHudTest = tasks.register('iceTypeEffectHudTest', JavaExec) {
    group = 'verification'
    description = 'Runs the Ice HUD progress and timer regression tests.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.epiac9.cobblemonnml.battle.action.typeeffect.ice.ActionBattleIceHudTest'
}

tasks.named('test') {
    dependsOn fireStateTest, typeEffectControllerTest, iceTypeEffectTest, iceTypeEffectDeliveryTest, iceTypeEffectHudTest
    failOnNoDiscoveredTests = false
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version
    ]

    inputs.properties replaceProperties

    from('src/main/META-INF') {
        include 'neoforge.mods.toml'
        into 'META-INF'
        expand replaceProperties
    }

    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            url = uri("${project.projectDir}/repo")
        }
    }
}
