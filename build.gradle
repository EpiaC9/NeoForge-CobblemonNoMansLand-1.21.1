tasks.named('test') {
    dependsOn fireStateTest, typeEffectControllerTest, iceTypeEffectTest, iceTypeEffectDeliveryTest, iceTypeEffectHudTest,
            fairyDrowsyStateTest
    dependsOn actionBattleSleepRulesTest
    dependsOn fairyControllerTest
    dependsOn poisonStateTest
    dependsOn poisonTrackerTest
    dependsOn poisonDeliveryTest
    dependsOn poisonRuntimeTest
    dependsOn poisonHudTest
    dependsOn electricStateTest
    dependsOn electricTrackerTest
    dependsOn electricIntegrationTest, electricDeliveryTest, electricHudTest
    dependsOn electricParalysisControllerTest
    dependsOn electricParalysisResolverTest
    failOnNoDiscoveredTests = false
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version
    ]

    inputs.properties replaceProperties

    from('src/main/META-INF') {
        include 'neoforge.mods.toml'
        into 'META-INF'
        expand replaceProperties
    }

    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            url = uri("${project.projectDir}/repo")
        }
    }
}
